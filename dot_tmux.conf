# Prefix Ctrl+a로 변경
set -g prefix C-a
unbind C-b
bind C-a send-prefix

# 마우스 지원 활성화
set -g mouse on

# 스크롤 버퍼 크기 늘리기
set -g history-limit 100000

# 윈도우를 닫으면 번호를 재정렬
set -g renumber-windows on

# Escape 키 지연 제거
set -sg escape-time 0

set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-ghostty:RGB:clipboard"

# split panes
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# pane hjkl 로 이동할수 있도록
bind -r h select-pane -L
bind -r j select-pane -D
bind -r k select-pane -U
bind -r l select-pane -R

# Copy 모드에서 vi 스타일 단축키 사용
setw -g mode-keys vi
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-selection-and-cancel


set -g allow-passthrough on
set -ga update-environment TERM
set -ga update-environment TERM_PROGRAM

bind r source-file ~/.tmux.conf \; display "Reloaded!!"

unbind -T copy-mode-vi MouseDragEnd1Pane
unbind -T copy-mode MouseDragEnd1Pane

set -s extended-keys always
set -s extended-keys-format csi-u
set -as terminal-features 'xterm*:extkeys'

# Oasis 테마 파일은 기존 색상 변수를 덮어쓰지 않는다. 테마 변경 후 재로드할 때
# 이전 팔레트가 남지 않도록, TPM이 Oasis를 초기화하기 전에 비운다.
set -gu @thm_strong_primary
set -gu @thm_primary
set -gu @thm_light_primary
set -gu @thm_secondary
set -gu @thm_prefix
set -gu @thm_fg
set -gu @thm_core
set -gu @thm_mantle
set -gu @thm_surface
set -gu @thm_visual
set -gu @thm_red
set -gu @thm_orange
set -gu @thm_yellow
set -gu @thm_green
set -gu @thm_teal
set -gu @thm_blue
set -gu @thm_indigo

# Oasis는 상태줄 레이아웃과 모듈만 사용하고, 팔레트는 아래 값으로 직접 관리한다.
set -g @oasis_flavor "midnight_dark"

# Custom palette — Mint Night
# 메인: RGB(102, 208, 156) = #66D09C, 활성 창: 흰색
set -g @thm_strong_primary "#66D09C"
set -g @thm_primary "#83DDB2"
set -g @thm_light_primary "#B1F0D0"
set -g @thm_secondary "#C9F4DD"
set -g @thm_window_inactive "#55B784"
set -g @thm_prefix "#F6C177"
set -g @thm_fg "#E6F5EE"

set -g @thm_core "#0D1714"
set -g @thm_mantle "#13211D"
set -g @thm_surface "#172923"
set -g @thm_visual "#355148"

set -g @thm_red "#F38BA8"
set -g @thm_orange "#F5B971"
set -g @thm_yellow "#F2D479"
set -g @thm_green "#66D09C"
set -g @thm_teal "#62C9B0"
set -g @thm_blue "#8AB4F8"
set -g @thm_indigo "#C5A5F5"

set -g @continuum-restore 'on'
set -g @resurrect-strategy-nvim 'session'

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'uhs-robert/tmux-oasis'
set -g @plugin 'joshmedeski/tmux-nerd-font-window-name'

# TPM 초기화 (플러그인 선언 뒤에 위치해야 함)
run '~/.tmux/plugins/tpm/tpm'

# 창 목록은 메인 민트 레일 위에서 활성 창만 강조한다.
set -g @oasis_module_window_inactive "\
#{?client_prefix,\
#{#[bg=#{@thm_strong_primary},fg=#{@thm_core}] #I#{?#{!=:#{window_name},Window}, #W,} },\
#{#[bg=#{@thm_strong_primary},fg=#{@thm_core}] #I#{?#{!=:#{window_name},Window}, #W,} }}"

# 활성 창도 장식 없는 직사각형 블록으로 표시한다.
set -g @oasis_module_window_active "\
#[bg=#{@thm_secondary},fg=#{@thm_core},bold] #I#{?#{!=:#{window_name},Window}, #W,} "

# 디렉터리는 세션, 시간은 NORMAL 배지와 같은 색상 역할을 사용한다.
set -g @oasis_module_folder "\
#{?pane_synchronized,#{#[bg=#{E:@oasis_color_mode},fg=#{@thm_surface}]},#{#[bg=#{@thm_strong_primary},fg=#{@thm_surface}]}}\
#[bg=#{@thm_surface},fg=#{E:@oasis_color_mode},bold] #{@oasis_folder_icon} #{=/-25/...:#{s|$USER|~|:#{b:pane_current_path}}} #[bg=#{E:@oasis_color_mode},fg=#{@thm_surface}]"

set -g @oasis_module_clock "\
#[bg=#{E:@oasis_color_mode},fg=#{@thm_surface},bold] #{@oasis_clock_icon} #{?#{==:#{@oasis_clock_24h},on},%H:%M:%S ,%I:%M:%S %p }"

# Oasis가 설정한 스타일을 메인 색상으로 마무리한다.
set -g status-style "bg=#66D09C,fg=#0D1714"
set -g window-status-separator ""
setw -g pane-border-style "fg=#66D09C"
setw -g pane-active-border-style "fg=#66D09C"
