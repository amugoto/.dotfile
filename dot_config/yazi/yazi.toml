[preview]
# Change them to your desired values
max_width = 1000
max_height = 1000


[mgr]
linemode = "size"
sort_by = "btime"
show_hidden = true

[[plugin.prepend_fetchers]]
url = "*"
run = "image-meta"
group = "image-meta"

[[plugin.prepend_previewers]]
url = "*.csv"
run = "csv-preview"

[opener]
sheets = [{ run = 'sheets "$@"', block = true, for = "unix" }]

[open]
prepend_rules = [{ url = "*.csv", use = "sheets" }]
